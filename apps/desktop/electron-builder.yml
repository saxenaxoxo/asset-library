# appId stays as it was before the rename to Goated Panels Hub: Windows and macOS identify the
# installed app by it, so an update replaces the old install instead of sitting beside it (decision I2).
appId: com.saxenascreation.assetlibrary
productName: Goated Panels Hub
copyright: Copyright © 2026 Goated Panels
directories:
  buildResources: build
  output: dist
# Each platform lists its files in full: a platform list of only exclusions would pull in the
# whole folder (every platform's FFmpeg).
files:
  - out/**
  - package.json
  # Menu-bar / notification-area icons (1x and 2x), also loaded from disk at runtime.
  - resources/tray*.png
  - '!**/*.map'
# The Premiere panel opens assetlibrary://start to start the engine when it isn't running.
protocols:
  - name: Asset Library
    schemes: [assetlibrary]
asarUnpack:
  - resources/**
  - '**/*.node'
npmRebuild: false

mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  entitlementsInherit: build/entitlements.mac.plist
  files:
    - out/**
    - package.json
    - resources/tray*.png
    - '!**/*.map'
    # Only ship the SQLite binaries this platform can load.
    - '!**/better-sqlite3/prebuilds/{linux,linuxmusl,win32}-*'
  # No Apple Developer ID by founder decision. Ad-hoc signing ("-") keeps the bundle's
  # signature valid so Apple Silicon shows "Open Anyway" instead of "damaged".
  notarize: false
  identity: '-'
  entitlements: build/entitlements.mac.plist
  extraResources:
    - from: ../../THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
    - from: resources/ffmpeg/darwin-${arch}
      to: ffmpeg
      filter: ['ffmpeg', 'ffprobe', 'BUILD-INFO.txt', 'LICENSE.txt']
    # The Premiere Pro panel, installed into Premiere by the app (scripts/prepare-panel.mjs).
    - from: .cache/premiere-panel
      to: premiere-panel
      filter: ['*.ccx', '*.zxp']
dmg:
  artifactName: Goated-Panels-Hub-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  executableName: Goated Panels Hub
  files:
    - out/**
    - package.json
    - resources/tray*.png
    - '!**/*.map'
    - '!**/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*'
    - '!**/better-sqlite3/prebuilds/win32-arm64.node'
  extraResources:
    - from: ../../THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
    - from: resources/ffmpeg/win32-${arch}
      to: ffmpeg
      filter: ['*.exe', '*.dll', 'BUILD-INFO.txt', 'LICENSE.txt']
    - from: .cache/premiere-panel
      to: premiere-panel
      filter: ['*.ccx', '*.zxp']
nsis:
  artifactName: Goated-Panels-Hub-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Goated Panels Hub
  uninstallDisplayName: Goated Panels Hub
  createDesktopShortcut: always
  # Moves an install from before the rename to the new folder name; on uninstall removes the
  # Premiere panel, login item and link, and offers to delete the library.
  include: build/installer.nsh

publish:
  provider: github
  owner: saxenaxoxo
  repo: asset-library
  releaseType: draft
