# Only the apps are workspace packages. packages/* are source folders the apps import through path
# aliases (@brand/*, @catalog/*), so they have no package.json of their own.
packages:
  - apps/*

# Dependencies allowed to run install scripts (pnpm blocks all others by default)
allowBuilds:
  electron: true
  esbuild: true
  sharp: true
  better-sqlite3: true
  electron-winstaller: false
