  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g transform="translate(232 232) scale(8.75)">
    <rect x="7" y="28" width="7" height="26" rx="3.5" fill="#DDD6FE"/>
    <rect x="17" y="14" width="7" height="40" rx="3.5" fill="#C4B5FD"/>
    <rect x="27" y="22" width="7" height="32" rx="3.5" fill="#FFFFFF"/>
    <rect x="37" y="9" width="7" height="45" rx="3.5" fill="#A78BFA"/>
    <rect x="47" y="30" width="7" height="24" rx="3.5" fill="#8B5CF6" transform="rotate(16 47 54)"/>
  </g>
</svg>
