  <rect width="1024" height="1024" rx="228" fill="url(#gi-bg)"/>
  <rect x="270.0" y="449.02" width="302.82" height="129.41" rx="18.98" fill="#C6FF3D" opacity="0.55" filter="url(#gi-glow)"/>
  <rect x="270.0" y="316.16" width="484.0" height="99.22" rx="18.98" fill="url(#gi-top)"/>
  <rect x="270.0" y="449.02" width="302.82" height="129.41" rx="18.98" fill="url(#gi-accent)"/>
  <rect x="600.43" y="449.02" width="153.57" height="129.41" rx="18.98" fill="url(#gi-mid)"/>
  <rect x="270.0" y="608.63" width="204.47" height="99.22" rx="18.98" fill="url(#gi-mid)"/>
  <rect x="500.35" y="608.63" width="113.88" height="99.22" rx="18.98" fill="url(#gi-dark)"/>
  <rect x="638.39" y="608.63" width="115.61" height="99.22" rx="18.98" fill="url(#gi-dark)"/>
