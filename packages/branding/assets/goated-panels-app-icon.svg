<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Goated Panels">
  <!-- Goated Panels app icon: the mark on near-black with a soft glow behind the lit tile. -->
  <defs>
    <linearGradient id="gi-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8E8EF"/></linearGradient>
    <linearGradient id="gi-accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDFF8A"/><stop offset="1" stop-color="#A3DB1F"/></linearGradient>
    <linearGradient id="gi-mid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#71717D"/><stop offset="1" stop-color="#4C4C57"/></linearGradient>
    <linearGradient id="gi-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#40404A"/><stop offset="1" stop-color="#2C2C33"/></linearGradient>
    <radialGradient id="gi-bg" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#171A10"/><stop offset="0.6" stop-color="#0B0C09"/><stop offset="1" stop-color="#070709"/></radialGradient>
